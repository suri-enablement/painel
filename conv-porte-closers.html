<style>
:root{--blue:#3d5af1;--blue-dark:#2a3fc4;--blue-bg:#eef1ff;--page-bg:#eef3ff;--surface:#fff;--ink:#101a33;--muted:#5b6480;--border:#dfe5f8;--green:#0fa968;--green-bg:#e3f8ef;--amber:#b45309;--amber-bg:#fef3c7;--pink-text:#c11574;--pink-bg:#ffe4f3;--gold:#caa202;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Sora',sans-serif;background:radial-gradient(1100px 480px at 8% -10%,#dce5ff 0%,transparent 60%),radial-gradient(900px 420px at 100% 0%,#e7ecff 0%,transparent 55%),var(--page-bg);color:var(--ink);min-height:100vh;padding:1.75rem 2.25rem 3rem;}
.page{max-width:1400px;margin:0 auto;}
.topbar{display:flex;align-items:center;gap:1.125rem;margin-bottom:1.375rem;}
.logo-wrap{display:flex;align-items:center;gap:1rem;}
.logo-wrap img{height:2rem;}
.divider{width:1px;height:2.125rem;background:var(--border);}
.title-block h1{margin:0;font-size:1.3rem;font-weight:700;}
.title-block p{margin:.125rem 0 0;font-size:.8rem;color:var(--muted);}
.back-link{margin-left:auto;font-size:.78rem;font-weight:600;color:var(--blue-dark);text-decoration:none;}
.toolbar{display:flex;align-items:flex-end;gap:1.25rem;margin-bottom:1.25rem;flex-wrap:wrap;}
.filter-group{display:flex;flex-direction:column;gap:.375rem;}
.filter-label{font-size:.625rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);}
.pill-group{display:flex;background:var(--surface);border:1px solid var(--border);border-radius:1.25rem;padding:.25rem;gap:.125rem;}
.pill-btn{font-family:'Sora',sans-serif;border:none;background:transparent;color:var(--muted);font-size:.78rem;font-weight:700;padding:.5rem 1rem;border-radius:1rem;cursor:pointer;transition:.15s;white-space:nowrap;}
.pill-btn:hover{color:var(--blue-dark);}
.pill-btn.active{background:var(--blue);color:#fff;}
.filter-sep{width:1px;height:3.25rem;background:var(--border);flex-shrink:0;}
.view-pills{margin-left:auto;align-self:flex-end;}
.period-label{font-size:.75rem;font-weight:600;background:var(--blue-bg);color:var(--blue-dark);padding:.375rem .75rem;border-radius:.75rem;align-self:flex-end;white-space:nowrap;}
.kpi-scroll{display:flex;gap:.625rem;overflow-x:auto;padding-bottom:.25rem;margin-bottom:1.25rem;scrollbar-width:thin;}
.kpi-card{background:var(--surface);border:1.5px solid var(--border);border-radius:.875rem;padding:.875rem 1.125rem;flex-shrink:0;min-width:160px;}
.kpi-card.best{border-color:#90e0bb;}
.kpi-card.worst{border-color:#ffb3d0;}
.kpi-card .lbl{font-size:.6rem;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.04em;margin-bottom:.5rem;}
.kpi-card .kv{font-size:1.375rem;font-weight:800;letter-spacing:-.02em;margin-bottom:.125rem;}
.kpi-card .rec{font-size:.75rem;font-weight:700;color:var(--green);margin-bottom:.1875rem;}
.kpi-card .sub{font-size:.65rem;color:var(--muted);}
.controls{display:flex;align-items:center;gap:.625rem;margin-bottom:.875rem;flex-wrap:wrap;}
.search-input{font-family:'Sora',sans-serif;border:1px solid var(--border);background:var(--surface);color:var(--ink);font-size:.78rem;padding:.4375rem .75rem .4375rem 2rem;border-radius:1.125rem;width:200px;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='13' height='13' viewBox='0 0 24 24' fill='none' stroke='%235b6480' stroke-width='2'><circle cx='11' cy='11' r='7'/><line x1='21' y1='21' x2='16.65' y2='16.65'/></svg>");background-repeat:no-repeat;background-position:10px center;}
.search-input:focus{outline:none;border-color:var(--blue);}
.search-input::placeholder{color:#9aa3bd;}
.legend{display:flex;align-items:center;gap:.75rem;font-size:.72rem;color:var(--muted);font-weight:500;margin-left:auto;flex-wrap:wrap;}
.legend .sw{display:inline-flex;align-items:center;gap:.3125rem;}
.legend .dot{width:.625rem;height:.625rem;border-radius:.1875rem;display:inline-block;}
.table-wrap{background:var(--surface);border:1px solid var(--border);border-radius:1rem;overflow:auto;margin-bottom:1.125rem;}
table{width:100%;border-collapse:collapse;}
thead th{font-size:.68rem;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.04em;padding:.75rem .625rem;border-bottom:1px solid var(--border);background:#fafbff;position:sticky;top:0;white-space:nowrap;text-align:center;}
thead th:first-child{text-align:left;position:sticky;left:0;z-index:2;background:#fafbff;}
tbody td{padding:.625rem;border-bottom:1px solid #eef1f9;text-align:center;white-space:nowrap;}
tbody td:first-child{text-align:left;font-weight:700;position:sticky;left:0;background:var(--surface);z-index:1;font-size:.8rem;}
tbody tr:last-child td{border-bottom:none;}
tbody tr:hover td{background:#fafbff;}
tbody tr:hover td:first-child{background:#fafbff;}
.avg-row td{background:#fafbff !important;font-weight:700;font-size:.72rem;color:var(--muted);border-top:2px solid var(--border);}
.avg-row td:first-child{color:var(--ink);}
.cell{display:inline-flex;flex-direction:column;align-items:center;min-width:5.75rem;padding:.375rem .625rem;border-radius:.625rem;gap:.125rem;}
.cell .c-pct{font-size:.875rem;font-weight:800;}
.cell .c-rec{font-size:.68rem;font-weight:700;opacity:.9;}
.cell .c-sh{font-size:.625rem;opacity:.7;}
.h-great{background:var(--green-bg);color:var(--green);}
.h-good{background:var(--blue-bg);color:var(--blue-dark);}
.h-warn{background:var(--amber-bg);color:var(--amber);}
.h-bad{background:var(--pink-bg);color:var(--pink-text);}
.h-na{background:#f1f3f9;color:#aab2c8;}
.cb-dropdown{position:relative;width:260px;margin-bottom:1.25rem;user-select:none;}
.cb-trigger{display:flex;align-items:center;justify-content:space-between;background:var(--surface);border:1.5px solid var(--border);border-radius:.75rem;padding:.625rem .875rem;cursor:pointer;font-family:'Sora',sans-serif;font-size:.8rem;font-weight:600;color:var(--ink);transition:.15s;}
.cb-trigger:hover,.cb-trigger.open{border-color:var(--blue);}
.cb-trigger.open{border-bottom-left-radius:0;border-bottom-right-radius:0;}
.cb-chevron{font-size:.68rem;color:var(--muted);transition:transform .2s;}
.cb-trigger.open .cb-chevron{transform:rotate(180deg);}
.cb-menu{display:none;position:absolute;top:100%;left:0;right:0;background:var(--surface);border:1.5px solid var(--blue);border-top:none;border-bottom-left-radius:.75rem;border-bottom-right-radius:.75rem;z-index:100;max-height:280px;overflow-y:auto;box-shadow:0 .5rem 1.5rem -.5rem rgba(61,90,241,.2);}
.cb-menu.open{display:block;}
.cb-item{display:flex;align-items:center;gap:.625rem;padding:.5625rem .875rem;cursor:pointer;font-family:'Sora',sans-serif;font-size:.8rem;font-weight:500;color:var(--ink);}
.cb-item:hover{background:var(--blue-bg);}
.cb-item.all{font-weight:700;border-bottom:1px solid var(--border);color:var(--muted);}
.squad-row{display:flex;border-bottom:1px solid var(--border);}
.squad-btn{flex:1;font-family:'Sora',sans-serif;font-size:.72rem;font-weight:700;border:none;background:transparent;padding:.4375rem .625rem;cursor:pointer;}
.squad-btn:first-child{border-right:1px solid var(--border);color:#7B78FF;}
.squad-btn:last-child{color:#FF3CAC;}
.cb-item input[type=checkbox]{width:.9375rem;height:.9375rem;accent-color:var(--blue);cursor:pointer;flex-shrink:0;}
.cb-swatch{width:.625rem;height:.625rem;border-radius:.1875rem;flex-shrink:0;}
.charts-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(440px,100%),1fr));gap:1rem;}
.hbar-chart{background:#fafbff;border:1px solid var(--border);border-radius:.875rem;padding:1.25rem 1.25rem 1rem;}
.hbar-title{font-size:.85rem;font-weight:700;color:var(--ink);margin-bottom:.125rem;}
.hbar-avg-tag{display:inline-flex;align-items:center;font-size:.65rem;font-weight:700;color:var(--gold);background:#fff8e1;border:1px solid var(--gold);border-radius:.375rem;padding:.0625rem .4375rem;margin-left:.375rem;vertical-align:middle;}
.hbar-sub{font-size:.7rem;color:var(--muted);margin-bottom:1rem;}
.hbar-rows{display:flex;flex-direction:column;gap:.4375rem;}
.hbar-row{display:grid;grid-template-columns:clamp(80px,20%,130px) 1fr clamp(38px,6%,56px);align-items:center;gap:.5rem;}
.hbar-name{font-size:.75rem;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:right;}
.hbar-track{height:1.375rem;background:#eef1f9;border-radius:.3125rem;position:relative;overflow:hidden;}
.hbar-fill{height:100%;border-radius:.3125rem;display:flex;align-items:center;justify-content:flex-end;padding-right:.4375rem;transition:width .4s ease;position:relative;}
.hbar-fill .hp{font-size:.7rem;font-weight:800;color:#fff;white-space:nowrap;}
.hbar-fill.lo .hp{display:none;}
.hbar-ext{position:absolute;top:50%;transform:translateY(-50%);font-size:.7rem;font-weight:700;color:var(--ink);white-space:nowrap;left:calc(100% + .3125rem);}
.hbar-pct{font-size:.75rem;font-weight:800;color:var(--ink);text-align:right;}
.hbar-avg-line{position:absolute;top:0;bottom:0;width:2px;background:var(--gold);z-index:2;border-radius:1px;}
.hbar-divider{height:1px;background:var(--border);margin:.25rem 0;}
.no-selection{text-align:center;padding:2.5rem;color:var(--muted);font-size:.8rem;}
.methodology{background:var(--surface);border:1px solid var(--border);border-radius:.875rem;padding:1.125rem 1.375rem;font-size:.78rem;color:var(--muted);line-height:1.7;}
.methodology strong{color:var(--ink);}
</style>
</head>

function renderBullet(){

    const sorted=sel.map(c=>({c,d:cd[c]?.[s]||{shows:0,won:0,receita:0},color:COLORS[CLOSERS.indexOf(c)]})).sort((a,b)=>(pct(b.d.won,b.d.shows)||0)-(pct(a.d.won,a.d.shows)||0));

function toggleDropdown(){document.getElementById("cbTrigger").classList.toggle("open");document.getElementById("cbMenu").classList.toggle("open");}
document.addEventListener("click",e=>{if(!document.getElementById("cbMenu").contains(e.target)&&!document.getElementById("cbTrigger").contains(e.target)){document.getElementById("cbTrigger").classList.remove("open");document.getElementById("cbMenu").classList.remove("open");}});
function updateCbLabel(){const n=selectedClosers.size;document.getElementById("cbLabel").textContent=n===CLOSERS.length?"Todos os closers":n===1?[...selectedClosers][0]:`${n} closers selecionados`;document.getElementById("cbAll").checked=n===CLOSERS.length;document.getElementById("cbAll").indeterminate=n>0&&n<CLOSERS.length;}
function buildCbItems(){document.getElementById("cbItems").innerHTML=CLOSERS.map((c,i)=>`<label class="cb-item"><input type="checkbox" ${selectedClosers.has(c)?"checked":""} onchange="toggleCloser('${c}',this.checked)" style="accent-color:${COLORS[i]}"><span class="cb-swatch" style="background:${COLORS[i]}"></span>${c}</label>`).join("");updateCbLabel();}
function toggleCloser(c,checked){if(!checked&&selectedClosers.size===1)return;if(checked)selectedClosers.add(c);else selectedClosers.delete(c);updateCbLabel();renderBullet();}
function toggleAll(el){if(el.checked)CLOSERS.forEach(c=>selectedClosers.add(c));else{selectedClosers.clear();selectedClosers.add(CLOSERS[0]);}buildCbItems();renderBullet();}
function selectSquad(squad){selectedClosers.clear();SQUADS[squad].forEach(c=>selectedClosers.add(c));buildCbItems();renderBullet();}
function buildCSVLinks(){
  const el=document.getElementById("csvLinks");if(!el)return;
  ["jan","fev","mar","abr","mai","jun","jul","trimestre","ano"].forEach(key=>{
    const p=CONV_PORTE.periods[key];if(!p)return;
    const rows=["Closer,Porte,Shows,Vendas,Conv%,Receita"];
    CLOSERS.forEach(c=>sz().forEach(s=>{const d=p.data.closers[c]?.[s]||{shows:0,won:0,receita:0};if(!d.shows)return;rows.push(`"${c}","${s}",${d.shows},${d.won},${(d.shows>0?d.won/d.shows*100:0).toFixed(1)},${d.receita.toFixed(2)}`)}));
    const lbl=key==="ano"?"Este Ano":key==="trimestre"?"Trim.":key.charAt(0).toUpperCase()+key.slice(1);
    const b64=btoa(unescape(encodeURIComponent(rows.join("\n"))));
    const a=document.createElement("a");a.href=`data:text/csv;base64,${b64}`;a.download=`conv-porte-${key}-2026.csv`;a.textContent=`\u2B07 ${lbl}`;a.style.cssText="display:inline-flex;align-items:center;gap:.3rem;font-size:.72rem;font-weight:700;color:var(--blue-dark);text-decoration:none;padding:.375rem .75rem;border:1px solid var(--border);border-radius:.5625rem;background:var(--surface)";el.appendChild(a);
  });
}
buildCbItems();buildCSVLinks();renderAll();
</script>
</body>
</html>
